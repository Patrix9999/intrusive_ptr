name: Verify

on:
  push:
  pull_request:

jobs:
  clang_format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          python3 -m pip install "clang-format==20.1.8"

      - name: Check code formatting
        run: |
          shopt -s globstar
          clang-format --dry-run -Werror **/*.cpp **/*.h **/*.hpp

  test_linux:
    name: test-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset gcc-x64-release

      - name: Build
        run: cmake --build --preset gcc-x64-release

      - name: Test
        run: ctest --preset gcc-x64-release --output-on-failure

  test_windows:
    name: test-windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSVC
        uses: ./.github/actions/msvc-dev-cmd
        with:
          arch: x64

      - name: Configure
        run: cmake --preset msvc-x64-release

      - name: Build
        run: cmake --build --preset msvc-x64-release

      - name: Test
        run: ctest --preset msvc-x64-release --output-on-failure