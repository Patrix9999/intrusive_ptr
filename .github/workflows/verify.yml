name: Verify

on:
  push:
    branches:
      - '**'
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/*.h'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/*.h'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/verify.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang_format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          python3 -m pip install "clang-format==20.1.8"

      - name: Check code formatting
        run: |
          shopt -s globstar nullglob
          clang-format --dry-run -Werror **/*.cpp **/*.h **/*.hpp

  test_linux:
    name: test-linux
    runs-on: ubuntu-latest
    needs: clang_format

    env:
      preset: gcc-x64-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcovr

      - name: Configure
        run: cmake --preset ${{ env.preset }} -DENABLE_TEST_COVERAGE=ON

      - name: Build
        run: cmake --build --preset ${{ env.preset }}

      - name: Test
        run: ctest --preset ${{ env.preset }} --output-on-failure

      - name: Generate coverage report
        run: |
          gcovr \
            --root . \
            --object-directory out/build/${{ env.preset }} \
            --cobertura-pretty \
            --output coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage.xml
          fail_ci_if_error: true

  test_windows:
    name: test-windows
    runs-on: windows-latest
    needs: clang_format

    env:
      preset: msvc-clang-x64-release
      arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSVC
        uses: ./.github/actions/msvc-dev-cmd
        with:
          arch: ${{ env.arch }}

      - name: Configure
        run: cmake --preset ${{ env.preset }}

      - name: Build
        run: cmake --build --preset ${{ env.preset }}

      - name: Test
        run: ctest --preset ${{ env.preset }} --output-on-failure