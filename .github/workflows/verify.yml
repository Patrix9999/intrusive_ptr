name: Verify

on:
  push:
  pull_request:

jobs:
  clang_format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check code formatting
        run: |
          clang-format --version
          find . \
            -type f \
            \( -name '*.h' -o -name '*.hpp' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \) \
            -not -path './build/*' \
            -print0 |
          xargs -0 clang-format --dry-run --Werror

  test_linux:
    name: test-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset gcc-x64-release

      - name: Build
        run: cmake --build --preset gcc-x64-release

      - name: Test
        run: ctest --preset gcc-x64-release --output-on-failure

  test_windows:
    name: test-windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSVC
        uses: ./.github/actions/msvc-dev-cmd
        with:
          arch: x64

      - name: Configure
        run: cmake --preset msvc-x64-release

      - name: Build
        run: cmake --build --preset msvc-x64-release

      - name: Test
        run: ctest --preset msvc-x64-release --output-on-failure